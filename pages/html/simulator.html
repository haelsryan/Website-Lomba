<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulator: Rencana Keuangan | Dompet Cerdas</title>
    <script>
      try {
        const preference = localStorage.getItem('dompet-cerdas-theme') || 'system'
        const dark = preference === 'dark'
          || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme =
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/pages/jsx/simulator.jsx"></script>
  </head>
  <body class="min-h-screen bg-canvas p-3 font-sans text-navy antialiased lg:p-4">
    <div id="root"></div>
  </body>
</html>
