<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dompet Cerdas: Ketahanan Finansial untuk Keluarga dan UMKM</title>
    <meta name="description" content="Platform pencatatan arus kas bersama, pengingat tenggat tagihan, dan simulasi anggaran praktis untuk keluarga dan UMKM di Indonesia." />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dompet-cerdas-theme") || "system";
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>

  </head>

  </body>
